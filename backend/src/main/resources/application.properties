server.port=${PORT:8080}

# --- Neon (Postgres) ---------------------------------------------------
# Define estas variables de entorno (ver .env.example / README):
#   NEON_JDBC_URL   jdbc:postgresql://<host>/<db>?sslmode=require
#   NEON_USER       usuario de Neon
#   NEON_PASSWORD   contraseña de Neon
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon puede "dormir" el compute: damos margen para el primer arranque
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

# Las tablas se crean/actualizan solas la primera vez
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=always
